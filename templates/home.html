        .login {
            width: min(520px, 94vw);
            padding: 36px 38px 30px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(18px) saturate(135%);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.48),
                0 0 35px rgba(255, 90, 20, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.34);
            text-align: center;
            animation: appear 0.75s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login h1 {
            margin: 0 0 8px;
            color: #ffffff;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .login h1::before {
            content: "🔥";
            display: block;
            font-size: 42px;
            margin-bottom: 7px;
            animation: flame 1.6s ease-in-out infinite;
        }

        @keyframes flame {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-3px) scale(1.08);
            }
        }

        .login h1::after {
            content: "Algerian Forest Fire Machine Learning Prediction";
            display: block;
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.84);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .login form {
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px;
        }

        .login input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #d6ddd7;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #172019;
            font-size: 14px;
            transition: all 0.22s ease;
        }

        .login input::placeholder {
            color: #8b938d;
        }

        .login input:focus {
            border-color: #e65c13;
            box-shadow: 0 0 0 3px rgba(230, 92, 19, 0.13);
            transform: translateY(-1px);
        }

        /* Because the original HTML uses <br> after every input,
           hide those breaks so the CSS grid controls the layout. */
        .login form br {
            display: none;
        }

        .login button {
            grid-column: 1 / -1;
            width: 100%;
            height: 48px;
            margin-top: 7px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            background: linear-gradient(135deg, #e85d04, #c93612);
            box-shadow: 0 10px 24px rgba(201, 54, 18, 0.28);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .login button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(201, 54, 18, 0.38);
        }

        .login button:active {
            transform: translateY(0);
        }

        .login h2 {
            margin: 25px 0 0;
            padding: 18px 14px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(230, 92, 19, 0.18);
            color: #ffffff;
            font-size: 18px;
            line-height: 1.45;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .login h2::before {
            content: "📊";
            margin-right: 7px;
        }

        /* Make the returned prediction visually prominent */
        .login h2:not(:empty) {
            color: #a9360b;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .login {
                padding: 28px 20px 24px;
                border-radius: 20px;
            }

            .login form {
                grid-template-columns: 1fr;
            }

            .login button {
                grid-column: auto;
            }

            .login h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="login">
        <h1>Let's Predict The Fire in the Forest</h1>

        <!-- Main Input For Receiving Query to our ML -->

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <input type="text" name="Temperature" placeholder="Temperature" required="required" /><br>
            <input type="text" name="RH" placeholder="RH" required="required" /><br>
            <input type="text" name="Ws" placeholder="Ws" required="required" /><br>
            <input type="text" name="Rain" placeholder="Rain" required="required" /><br>
            <input type="text" name="FFMC" placeholder="FFMC" required="required" /><br>
            <input type="text" name="DMC" placeholder="DMC" required="required" /><br>
            <input type="text" name="ISI" placeholder="ISI" required="required" /><br>
            <input type="text" name="Classes" placeholder="Classes" required="required" /><br>
            <input type="text" name="Region" placeholder="Region" required="required" /><br>
            
            
            
            <button type="submit" class="btn btn-primary btn-block btn-large">Make Prediction</button>

        </form>

    <h2>
     Based on the given inputs the chances of occuring fire in the Forest are :  {{results}}
    </h2>    
</body> 
</html>
